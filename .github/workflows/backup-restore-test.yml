name: backup-restore-test

on:
  schedule:
    # Weekly drill: every Sunday at 04:00 UTC (right after the daily backup).
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # opens an issue on failure

concurrency:
  group: backup-restore-test
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U restore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install pg client, age and aws-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client age awscli

      - name: Write age identity from secret
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          mkdir -p ~/.age
          umask 077
          printf '%s' "${BACKUP_AGE_IDENTITY}" >~/.age/miru.key

      - name: Restore latest dump into ephemeral Postgres
        env:
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          AGE_IDENTITY_FILE: /home/runner/.age/miru.key
          TARGET_DATABASE_URL: postgresql://restore:restore@localhost:55432/restore
        run: |
          chmod +x scripts/backup/restore.sh
          ./scripts/backup/restore.sh latest

      - name: Smoke checks
        env:
          PGURL: postgresql://restore:restore@localhost:55432/restore
        run: |
          set -euo pipefail
          # 1. The schema came back.
          TABLES=$(psql "$PGURL" -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "tables restored: $TABLES"
          test "$TABLES" -gt 30 || { echo "expected >30 tables, got $TABLES"; exit 1; }
          # 2. Migrations are tracked.
          MIGS=$(psql "$PGURL" -At -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          echo "applied migrations: $MIGS"
          test "$MIGS" -gt 0 || { echo "no migrations in restored dump"; exit 1; }
          # 3. Core tables have rows (anything > 0 is fine).
          for t in Anime Genre Platform; do
            COUNT=$(psql "$PGURL" -At -c "SELECT count(*) FROM \"$t\"")
            echo "$t: $COUNT rows"
          done

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `backup-restore-test failed (${today})`,
              body: [
                '⚠️ The weekly disaster-recovery drill failed.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Investigate before the next deploy — an untested backup is no backup.',
              ].join('\n'),
              labels: ['ops', 'backup'],
            });
